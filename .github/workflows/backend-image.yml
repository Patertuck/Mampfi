name: Backend image

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/backend-image.yml"
      - "Dockerfile"
      - "server/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-master
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/patertuck/mampfi-backend
  TARGET_PLATFORMS: ${{ vars.DOCKER_BUILD_PLATFORM || 'linux/amd64' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine whether the backend artifact changed
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            deploy:
              - '.github/workflows/backend-image.yml'
              - 'Dockerfile'
              - 'server/src/main/**'
              - 'server/build.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify server tests
        run: ./gradlew :server:test --no-daemon

      - name: Validate target platforms
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          case "$TARGET_PLATFORMS" in
            linux/amd64|linux/arm64|linux/amd64,linux/arm64) ;;
            *) echo "Unsupported DOCKER_BUILD_PLATFORM: $TARGET_PLATFORMS" >&2; exit 1 ;;
          esac

      - name: Set up QEMU
        if: (github.event_name == 'workflow_dispatch' || steps.changes.outputs.deploy == 'true') && env.TARGET_PLATFORMS != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.deploy == 'true'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push backend image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ env.TARGET_PLATFORMS }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
