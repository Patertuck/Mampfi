name: Android release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify tests
        run: ./gradlew :server:test :androidApp:compileReleaseKotlin --no-daemon

      - name: Create signed release APK
        id: build
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          KEYSTORE_PATH="$RUNNER_TEMP/mampfi-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          TAG="v$VERSION_NAME"
          UPDATE_URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json"
          ./gradlew :androidApp:assembleRelease --no-daemon \
            -Pmampfi.versionCode="$VERSION_CODE" \
            -Pmampfi.versionName="$VERSION_NAME" \
            -Pmampfi.updateMetadataUrl="$UPDATE_URL" \
            -Pmampfi.releaseStoreFile="$KEYSTORE_PATH" \
            -Pmampfi.releaseStorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -Pmampfi.releaseKeyAlias="$ANDROID_KEY_ALIAS" \
            -Pmampfi.releaseKeyPassword="$ANDROID_KEYSTORE_PASSWORD"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          TAG: ${{ steps.build.outputs.tag }}
        shell: bash
        run: |
          APK_PATH="androidApp/build/outputs/apk/release/androidApp-release.apk"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/mampfi-$VERSION_NAME.apk"
          printf '{\n  "latest_version": "%s",\n  "changelog": "",\n  "apk_url": "%s"\n}\n' "$VERSION_NAME" "$APK_URL" > update.json
          cp "$APK_PATH" "mampfi-$VERSION_NAME.apk"
          gh release create "$TAG" "mampfi-$VERSION_NAME.apk#Mampfi APK" "update.json#Update manifest" --title "Mampfi $VERSION_NAME" --generate-notes
