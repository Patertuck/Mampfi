services:
  mampfi:
    image: ghcr.io/patertuck/mampfi-backend:${MAMPFI_IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: /data/mampfi.db
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
    volumes:
      - ./data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.lifecycle.pre-update: "/app/bin/server backup-before-update"
    restart: unless-stopped
    stop_grace_period: 30s

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.20.0
    command: --label-enable --interval 300 --cleanup --enable-lifecycle-hooks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
